# SonarQube Cloud analysis of the SDK, run by the "SonarQube" job in .github/workflows/ci.yml.
# Project and organization keys: from the project's page in SonarQube Cloud.
sonar.projectKey=sfere-io_sfere-ios-sdk
sonar.organization=sfere-io
sonar.projectName=sfere-ios-sdk

# The SDK and its tests. The sample app (Example/) and the scripts (tools/) are test
# tooling that never ships to apps, the same as the Android SDK's sample module.
sonar.sources=Sources
sonar.tests=Tests
sonar.sourceEncoding=UTF-8

# Coverage from the "Tests & coverage" job: llvm-cov's lcov converted to SonarQube's
# generic coverage format, paths relative to the repository root.
sonar.coverageReportPaths=build/ci/sonar-coverage.xml

# A failed quality gate fails the job (and with it the required "SonarQube" check).
sonar.qualitygate.wait=true
